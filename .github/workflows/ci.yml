# .github/workflows/ci.yml
#
# Crias-Server — CI/CD completo (lint + test + build + release)
#
#   lint-shell ─┐
#   lint-go ────┤
#   lint-python ┤
#   test-go ─────┤──→ build-agent ─┤──→ release
#   test-python ─┘──→ build-bot ───┘
#
# Triggers:
#   - push to main          → lint + test + build (no release)
#   - push tag v*.*.*       → lint + test + build + release (stable)
#   - PR to main            → lint + test only (no build, no release)
#   - workflow_dispatch     → full pipeline + optional release

name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar release do GitHub (consolida agent + bot + source + checksums)'
        type: boolean
        default: false

# cancel-in-progress true para branches/PRs (economiza runner minutes);
# false para tags (nao cancelar releases em andamento).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'
  PYTHON_VERSION: '3.12'
  # protoc-gen-go versions aligned with Dockerfile + Makefile.
  # Definidas como env vars (em vez de literais vX.Y.Z nos comandos) para:
  #   1. Manter a versão em UM lugar (DRY) — bumpar aqui atualiza todos os jobs.
  #   2. Evitar tags mutáveis literais no YAML (auditoria @v[0-9] retorna 0).
  #   3. Alinhar com o padrão do Makefile (PROTOC_GEN_GO_VERSION ?= v1.36.12).
  # Nota: protoc-gen-go-grpc é módulo próprio com versionamento independente do
  # grpc-go principal (não segue v1.84.0). Ver Makefile.
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'

jobs:
  # ═══════════════════════════════════════════════════════
  # LINT (3 jobs paralelos: shell, go, python)
  # ═══════════════════════════════════════════════════════

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # -x segue sources (resolve SC1091)
        # --exclude suprime falsos positivos conhecidos:
        #   SC1091: não segue source (já tratado com -x, mas alguns ainda warn)
        #   SC2034: var "unused" — falso positivo em libs sourced (vars usadas por callers)
        #   SC2016: expressões em single quotes — intencional em muitos casos
        #   SC2086: double quote — vamos corrigir aos poucos, não bloqueia CI
        #   SC2154: var referenced but not assigned — falso positivo em libs sourced
        #   SC2310: set -e em função — intencional
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x \
                --exclude SC1091,SC2034,SC2016,SC2086,SC2154,SC2310 \
                --severity=warning \
                || true
          # Re-roda só com errors (severity=error) para decidir pass/fail
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x \
                --exclude SC1091 \
                --severity=error

  lint-go:
    name: Lint Go
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Go vet
        run: go vet ./...

      - name: Go fmt check (non-blocking)
        # gofmt -l lista arquivos não formatados. Non-blocking por enquanto
        # (arquivos Go usam espaços em vez de tabs — migrar gradualmente).
        continue-on-error: true
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "⚠️ Arquivos não formatados com gofmt (non-blocking):"
            gofmt -l .
          else
            echo "✓ Todos os arquivos Go formatados com gofmt"
          fi

  lint-python:
    name: Lint Python
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Cache de pip para acelerar runs subsequentes.
          cache: 'pip'
          cache-dependency-path: discord-bot/requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.15"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ═══════════════════════════════════════════════════════
  # TEST (3 jobs paralelos: shell, go, python)
  # ═══════════════════════════════════════════════════════

  test-shell:
    name: Test Shell
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shell test suite
        # install-contracts e arch-dry-install rodam em container Arch separado.
        run: |
          bash tests/quick-script-tests.sh
          bash tests/install-contracts.sh
          bash tests/static-audit.sh
          bash tests/stack-installer-test.sh
          bash tests/agent-install-hook-test.sh
          bash tests/config-parser-eq-test.sh

  test-shell-arch:
    name: Test Shell (Arch container)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      options: --privileged --security-opt seccomp=unconfined
    steps:
      - name: Install deps
        run: |
          # Se keyring falhar, melhor falhar cedo do que instalar pacotes
          # nao-verificados.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git bash gettext jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run arch-specific tests
        run: |
          bash tests/arch-smoke.sh
          bash tests/arch-dry-install.sh

  test-go:
    name: Test Go (race)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Go test with race detector + coverage
        # Coverage profile for artifact upload.
        # Makefile `test` target e permite rastrear cobertura no CI.
        # Upload do coverage.out como artifact no próximo step.
        run: go test -v -race -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-go-coverage
          path: discord-agent/coverage.out
          retention-days: 14

  test-python:
    name: Test Python
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Cache de pip para acelerar runs subsequentes.
          cache: 'pip'
          cache-dependency-path: discord-bot/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned pytest for reproducibility.
          # pyproject.toml: pytest ~=8.0.0, pytest-asyncio ~=0.23.0, pytest-cov ~=4.1.0).
          pip install pytest==8.0.2 pytest-asyncio==0.23.5 pytest-cov==4.1.0

      - name: Generate protobuf code
        run: |
          mkdir -p src/crias_bot/grpc_gen
          python -m grpc_tools.protoc \
              -I ../discord-agent/proto \
              --python_out=src/crias_bot/grpc_gen \
              --grpc_python_out=src/crias_bot/grpc_gen \
              ../discord-agent/proto/crias.proto
          sed -i 's/^import crias_pb2 as crias__pb2/from crias_bot.grpc_gen import crias_pb2 as crias__pb2/' \
              src/crias_bot/grpc_gen/crias_pb2_grpc.py
          touch src/crias_bot/grpc_gen/__init__.py

      - name: Run pytest
        # Coverage report with missing lines shown in CI log.
        run: PYTHONPATH=src python -m pytest tests/ -v --tb=short --cov=crias_bot --cov-report=term-missing --cov-fail-under=50

  # ═══════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════

  build-agent:
    name: Build Agent (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint-go, test-go]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/crias-agent

      - name: Generate checksum
        run: |
          cd build
          sha256sum crias-agent-${{ matrix.goos }}-${{ matrix.goarch }} > crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            discord-agent/build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}
            discord-agent/build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          retention-days: 7

  build-bot:
    name: Build Bot (Docker)
    needs: [lint-python, test-python]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (smoke test)
        # Build context é a raiz do repo porque Dockerfile copia ../discord-agent/proto/
        run: docker build -t crias-bot:ci -f discord-bot/Dockerfile .

      - name: Create crias-bot.zip (source + Dockerfile, lightweight)
        # Zip com o source do bot + proto + Dockerfile. Usuário faz docker build
        # localmente — mais leve que um .tar de imagem (~200MB) e mais simples.
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -r /tmp/crias-bot.zip discord-bot/ discord-agent/proto/crias.proto

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-bot-zip
          path: /tmp/crias-bot.zip
          retention-days: 3

  # ═══════════════════════════════════════════════════════
  # RELEASE — job único que consolida TODOS artefatos
  # ═══════════════════════════════════════════════════════

  release:
    name: Release (consolidada)
    needs: [build-agent, build-bot]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      # attest-build-provenance requires attestations:write + id-token:write.
      # contents:write para criar a release/tag; id-token:write para OIDC token.
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Artefatos baixados ==="
          find artifacts/ -type f | sort
          echo ""
          echo "=== Tamanhos ==="
          du -sh artifacts/*

      - name: Validate required artifacts
        run: |
          # Valida que TODOS os artifacts esperados existem antes de publicar.
          echo "=== Validando artifacts obrigatorios ==="
          missing=0

          # Agent binaries (se build-agent rodou)
          if ! ls artifacts/crias-agent-*-amd64 >/dev/null 2>&1; then
            echo "WARN: nenhum crias-agent-*-amd64 encontrado"
          fi

          # Bot zip (se build-bot rodou)
          if [ ! -f artifacts/crias-bot.zip ]; then
            echo "WARN: crias-bot.zip nao encontrado"
          fi

          # Checksum re-verification dos artifacts que tem .sha256
          echo "=== Verificando checksums por-artifact ==="
          for sha_file in artifacts/*.sha256; do
            [ -f "$sha_file" ] || continue
            target_file="$(basename "${sha_file%.sha256}")"
            echo "Verificando $target_file ..."
            (cd artifacts && sha256sum -c "$(basename "$sha_file")") || {
              echo "ERROR: checksum falhou para $target_file" >&2
              missing=1
            }
          done

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: validacao de artifacts falhou — abortando release." >&2
            exit 1
          fi
          echo "OK: todos os artifacts validados com sucesso."

      - name: Prepare release assets
        run: |
          mkdir -p release-assets/agent release-assets/bot

          # Agent binaries + checksums
          mv artifacts/crias-agent-* release-assets/agent/ 2>/dev/null || true

          # Bot zip
          mv artifacts/crias-bot.zip release-assets/bot/ 2>/dev/null || true

          # Source archives (full + slim)
          mkdir -p release-assets/_pkg/full release-assets/_pkg/slim
          git archive --format=tar HEAD | tar -xf - -C release-assets/_pkg/full
          cp -a release-assets/_pkg/full/. release-assets/_pkg/slim/
          rm -rf release-assets/_pkg/slim/docs
          rm -rf release-assets/_pkg/slim/.github/workflows
          (cd release-assets/_pkg/full && zip -qr ../../crias-server-full.zip .)
          (cd release-assets/_pkg/slim && zip -qr ../../crias-server-slim.zip .)

          # Global checksum (não inclui sha256sums.txt no find — é o arquivo de saída)
          cd release-assets
          find . -type f \( -name '*.zip' -o -name 'crias-agent-*' \) \
            -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > sha256sums.txt
          cat sha256sums.txt

      - name: Compute release tag
        id: release_tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
            # Garante unicidade
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CICD-001: tag via env var (nao interpolacao direta) para evitar injecao de script
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          # CICD-001: todos os usos da tag via env var
          assets=()
          # Agent binaries
          for f in release-assets/agent/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Bot image
          [ -f release-assets/bot/crias-bot.zip ] && assets+=("release-assets/bot/crias-bot.zip")
          # Source archives
          assets+=("release-assets/crias-server-full.zip")
          assets+=("release-assets/crias-server-slim.zip")
          # Checksum global (sha256sums.txt com todos os artefatos)
          assets+=("release-assets/sha256sums.txt")

          echo "=== Assets para release ==="
          printf '  %s\n' "${assets[@]}"

          # Detecta prerelease via case (sem interpolacao direta)
          PRERELEASE="false"
          case "${RELEASE_TAG}" in
            *-beta*|*-rc*) PRERELEASE="true" ;;
          esac

          RELEASE_NOTES=$(cat <<'RN'
          ## O que há de novo

          Veja [CHANGELOG.md](https://github.com/ViniciusLopes7/Crias-Server/blob/main/CHANGELOG.md) para detalhes completos.

          ## Artefatos

          | Arquivo | Descrição |
          |---------|-----------|
          | `crias-agent-linux-amd64` | Binário do agente Go (controle remoto via Discord) |
          | `crias-agent-linux-amd64.sha256` | Checksum do agente |
          | `crias-bot.zip` | Source do bot Python + Dockerfile (faça `docker build` local) |
          | `crias-server-full.zip` | Repo completo (com docs, tests, workflows) |
          | `crias-server-slim.zip` | Repo sem docs/tests/workflows (mais leve) |
          | `sha256sums.txt` | Checksums de todos os artefatos |

          ## Instalação

          ```bash
          # Pré-requisito: Arch Linux instalado (https://archlinux.org/download/)
          curl -fsSL https://raw.githubusercontent.com/ViniciusLopes7/Crias-Server/main/crias-bootstrap.sh | sudo bash
          ```

          ## Verificação

          ```bash
          sha256sum -c sha256sums.txt   # valida integridade dos artefatos
          gh attestation verify crias-agent-linux-amd64 --repo ViniciusLopes7/Crias-Server  # SLSA provenance
          ```
          RN
          )

          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            --title "Crias-Server ${RELEASE_TAG}" \
            --notes "${RELEASE_NOTES}" \
            --prerelease="${PRERELEASE}"

      - name: Attest build provenance
        # 2A-005: gera atestação SLSA build provenance para os artefatos de release.
        # Requer permissions: { attestations: write, id-token: write } (definidas no job).
        # Usuário final verifica com: gh attestation verify <asset> --repo <repo>
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/agent/crias-agent-*
