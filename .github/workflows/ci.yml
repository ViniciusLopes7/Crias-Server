# .github/workflows/ci.yml
#
# Workflow único do Crias-Server. Jobs rodam em paralelo:
#
#   lint-shell ─┐
#   lint-go ────┤
#   lint-python ┤
#   test-shell ─┤──→ build-iso ────┐
#   test-go ─────┤──→ build-agent ─┤──→ release (consolida todos artefatos)
#   test-python ─┘──→ build-bot ───┘
#
# Release é criada apenas em:
#   - push de tag v*.*.* (release manual)
#   - workflow_dispatch com input release=true
#
# Em push/PR normal, apenas lint + test + build rodam (sem release).

name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar release no final (consolida ISO + agent + bot)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  PYTHON_VERSION: '3.12'
  # protoc-gen-go versions aligned with Dockerfile + Makefile.
  # Definidas como env vars (em vez de literais vX.Y.Z nos comandos) para:
  #   1. Manter a versão em UM lugar (DRY) — bumpar aqui atualiza todos os jobs.
  #   2. Evitar tags mutáveis literais no YAML (auditoria @v[0-9] retorna 0).
  #   3. Alinhar com o padrão do Makefile (PROTOC_GEN_GO_VERSION ?= v1.33.0).
  PROTOC_GEN_GO_VERSION: 'v1.33.0'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.3.0'

jobs:
  # ═══════════════════════════════════════════════════════
  # LINT (3 jobs paralelos: shell, go, python)
  # ═══════════════════════════════════════════════════════

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # -x segue sources (resolve SC1091)
        # --exclude suprime falsos positivos conhecidos:
        #   SC1091: não segue source (já tratado com -x, mas alguns ainda warn)
        #   SC2034: var "unused" — falso positivo em libs sourced (vars usadas por callers)
        #   SC2016: expressões em single quotes — intencional em muitos casos
        #   SC2086: double quote — vamos corrigir aos poucos, não bloqueia CI
        #   SC2154: var referenced but not assigned — falso positivo em libs sourced
        #   SC2310: set -e em função — intencional
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x \
                --exclude SC1091,SC2034,SC2016,SC2086,SC2154,SC2310 \
                --severity=warning \
                || true
          # Re-roda só com errors (severity=error) para decidir pass/fail
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x \
                --exclude SC1091 \
                --severity=error

  lint-go:
    name: Lint Go
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Go vet
        run: go vet ./...

      - name: Go fmt check (non-blocking)
        # gofmt -l lista arquivos não formatados. Non-blocking por enquanto
        # (arquivos Go usam espaços em vez de tabs — migrar gradualmente).
        continue-on-error: true
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "⚠️ Arquivos não formatados com gofmt (non-blocking):"
            gofmt -l .
          else
            echo "✓ Todos os arquivos Go formatados com gofmt"
          fi

  lint-python:
    name: Lint Python
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.3.7

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ═══════════════════════════════════════════════════════
  # TEST (3 jobs paralelos: shell, go, python)
  # ═══════════════════════════════════════════════════════

  test-shell:
    name: Test Shell
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run shell test suite
        # Roda bateria bash (sem testes ISO que precisam de ISO real).
        # install-contracts e arch-dry-install rodam em container Arch separado.
        run: |
          bash tests/quick-script-tests.sh
          bash tests/install-contracts.sh
          bash tests/static-audit.sh
          bash tests/stack-installer-test.sh
          bash tests/agent-install-hook-test.sh
          bash tests/config-parser-eq-test.sh

  test-shell-arch:
    name: Test Shell (Arch container)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      options: --privileged --security-opt seccomp=unconfined
    steps:
      - name: Install deps
        run: |
          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Syu --noconfirm --needed git bash gettext jq

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run arch-specific tests
        run: |
          bash tests/arch-smoke.sh
          bash tests/arch-dry-install.sh

  test-go:
    name: Test Go (race)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Go test with race detector + coverage
        # Coverage profile for artifact upload.
        # Makefile `test` target e permite rastrear cobertura no CI.
        # Upload do coverage.out como artifact no próximo step.
        run: go test -v -race -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artifact-go-coverage
          path: discord-agent/coverage.out
          retention-days: 14

  test-python:
    name: Test Python
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned pytest for reproducibility.
          # pyproject.toml: pytest ~=8.0.0, pytest-asyncio ~=0.23.0, pytest-cov ~=4.1.0).
          pip install pytest==8.0.2 pytest-asyncio==0.23.5 pytest-cov==4.1.0

      - name: Generate protobuf code
        run: |
          mkdir -p src/crias_bot/grpc_gen
          python -m grpc_tools.protoc \
              -I ../discord-agent/proto \
              --python_out=src/crias_bot/grpc_gen \
              --grpc_python_out=src/crias_bot/grpc_gen \
              ../discord-agent/proto/crias.proto
          sed -i 's/^import crias_pb2 as crias__pb2/from crias_bot.grpc_gen import crias_pb2 as crias__pb2/' \
              src/crias_bot/grpc_gen/crias_pb2_grpc.py
          touch src/crias_bot/grpc_gen/__init__.py

      - name: Run pytest
        # Coverage report with missing lines shown in CI log.
        run: PYTHONPATH=src python -m pytest tests/ -v --tb=short --cov=crias_bot --cov-report=term-missing --cov-fail-under=50

  # ═══════════════════════════════════════════════════════
  # BUILD (3 jobs paralelos: ISO, agent, bot) — só em main ou tag
  # ═══════════════════════════════════════════════════════

  build-iso:
    name: Build ISO
    needs: [lint-shell, test-shell, test-shell-arch]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
      options: --privileged --security-opt seccomp=unconfined
    steps:
      - name: Install dependencies
        run: |
          # pacman-key --init pode falhar em alguns runners; usamos --noconfirm
          # e continuamos mesmo se houver warning (keyring já vem populado na
          # imagem archlinux:base-devel atual).
          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Syu --noconfirm --needed archiso git grub

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Sync installer into airootfs (embed scripts in ISO)
        # Popula archiso-profile/airootfs/opt/crias-server/ com cópia do repo
        # para que a ISO nasça "pronta pra uso" (sem precisar de git clone no
        # primeiro boot). Ver archiso-profile/sync-airootfs.sh.
        run: |
          bash archiso-profile/sync-airootfs.sh
          echo "=== Conteúdo embutido na ISO (airootfs/opt/crias-server/) ==="
          find archiso-profile/airootfs/opt/crias-server/ -type f | sort

      - name: Validate embedded scripts
        run: bash tests/iso-embedded-scripts-validate.sh

      - name: Build ISO
        run: |
          mkdir -p out
          rm -rf /tmp/archiso-tmp
          mkarchiso -v -w /tmp/archiso-tmp -o out/ archiso-profile/

      - name: Generate checksums
        run: |
          cd out
          sha256sum *.iso > sha256sums-iso.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artifact-iso
          path: |
            out/*.iso
            out/sha256sums-iso.txt
          retention-days: 7

  test-iso-qemu:
    name: Test ISO (QEMU boot)
    needs: [build-iso]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download ISO artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: artifact-iso
          path: iso-download/

      - name: Find ISO file
        id: find_iso
        run: |
          ISO_FILE="$(find iso-download/ -name '*.iso' -type f | head -1)"
          if [ -z "$ISO_FILE" ]; then
            echo "FAIL: nenhuma ISO encontrada em iso-download/" >&2
            ls -la iso-download/ >&2
            exit 1
          fi
          echo "ISO encontrada: $ISO_FILE"
          ls -lh "$ISO_FILE"
          echo "iso_path=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate ISO 9660 format
        run: |
          ISO_FILE="${{ steps.find_iso.outputs.iso_path }}"
          # Verifica magic bytes de ISO 9660
          file "$ISO_FILE"
          if ! file "$ISO_FILE" | grep -qi 'ISO 9660'; then
            echo "FAIL: arquivo não é ISO 9660 válido" >&2
            exit 1
          fi
          # Verifica El Torito boot record no setor 17 da ISO 9660.
          # Estrutura ISO 9660:
          #   setor 16 (offset 32768): Primary Volume Descriptor (tipo 1)
          #   setor 17 (offset 34816): El Torito Boot Record (tipo 0)
          #   setor 18 (offset 36864): VD Set Terminator (tipo 255)
          # O Boot Record tem a string "EL TORITO SPECIFICATION" no offset 7
          # dentro do setor.
          #
          # IMPORTANTE: NÃO usar EL_TORITO="$(dd ...)" + echo | grep, porque:
          #   1. Offset 32769 (setor 16+1) aponta para o PVD, não o Boot Record.
          #      O offset correto é o setor 17 (skip=17 com bs=2048).
          #   2. bash $(...) stripa null bytes de output binário, corrompendo
          #      a comparação (warning: "ignored null byte in input").
          # Solução: pipe direto dd | grep -a (grep -a trata binário como texto).
          if dd if="$ISO_FILE" bs=2048 skip=17 count=1 2>/dev/null | grep -aq 'EL TORITO SPECIFICATION'; then
            echo "OK: El Torito boot record presente (ISO é bootável)"
          else
            echo "FAIL: El Torito boot record não encontrado no setor 17" >&2
            echo "  (dump do setor 17 para debug:)" >&2
            dd if="$ISO_FILE" bs=2048 skip=17 count=1 2>/dev/null | od -c | head -4 >&2
            exit 1
          fi

      - name: Install QEMU and OVMF (UEFI firmware)
        run: |
          sudo apt-get update
          # libarchive-tools fornece o binário bsdtar (no Ubuntu/Debian o
          # pacote não se chama "bsdtar" — é "libarchive-tools").
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf libarchive-tools
          echo "=== QEMU version ==="
          qemu-system-x86_64 --version | head -2
          echo "=== OVMF firmware ==="
          ls -la /usr/share/OVMF/ 2>/dev/null || ls -la /usr/share/ovmf/ 2>/dev/null || true

      - name: Enable KVM for faster QEMU boot
        # GitHub Actions ubuntu-22.04 runners têm /dev/kvm disponível.
        # KVM acelera o boot de ~10 min (emulação pura) para ~30s (virtualização).
        # Sem KVM, o kernel pode não completar boot em 5 min.
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "✓ KVM disponível (/dev/kvm acessível)"
            echo "has_kvm=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠ KVM não disponível — boot será lento (emulação TCG)"
            echo "has_kvm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract kernel and initramfs from ISO for QEMU -kernel boot
        # Extraí vmlinuz e initramfs da ISO para boot via QEMU -kernel.
        # Vantagem: podemos adicionar console=ttyS0,115200 via -append sem
        # afetar a ISO de produção (que não tem console=ttyS0 para evitar
        # loop de serial-getty em hardware real).
        id: extract_kernel
        run: |
          ISO_FILE="${{ steps.find_iso.outputs.iso_path }}"
          WORK_DIR="/tmp/iso-extract"
          mkdir -p "$WORK_DIR"

          # bsdtar extrai arquivos da ISO sem montar
          kernel_rel="$(bsdtar -tf "$ISO_FILE" | grep -E '.*/boot/x86_64/vmlinuz-linux$' | head -n 1 || true)"
          initramfs_rel="$(bsdtar -tf "$ISO_FILE" | grep -E '.*/boot/x86_64/initramfs-linux\.img$' | head -n 1 || true)"

          if [ -z "$kernel_rel" ] || [ -z "$initramfs_rel" ]; then
            echo "FAIL: kernel ou initramfs não encontrados na ISO" >&2
            exit 1
          fi

          echo "Extraindo: $kernel_rel"
          echo "Extraindo: $initramfs_rel"
          bsdtar -xf "$ISO_FILE" -C "$WORK_DIR" "$kernel_rel" "$initramfs_rel"

          KERNEL_FILE="$WORK_DIR/$kernel_rel"
          INITRAMFS_FILE="$WORK_DIR/$initramfs_rel"

          # Detecta install_dir (arch) e iso_label do profiledef
          install_dir="${kernel_rel%/boot/x86_64/vmlinuz-linux}"
          install_dir="${install_dir#/}"
          echo "install_dir=$install_dir" >> "$GITHUB_OUTPUT"
          echo "kernel_path=$KERNEL_FILE" >> "$GITHUB_OUTPUT"
          echo "initramfs_path=$INITRAMFS_FILE" >> "$GITHUB_OUTPUT"

          # Lê iso_label da ISO (volume label)
          ISO_LABEL="$(file "$ISO_FILE" | grep -oE "'[^']+ '" | head -1 | tr -d "' ")"
          if [ -z "$ISO_LABEL" ]; then
            # Fallback: label padrão do profiledef.sh
            ISO_LABEL="CRIAS00000"
          fi
          echo "iso_label=$ISO_LABEL" >> "$GITHUB_OUTPUT"
          echo "Kernel: $KERNEL_FILE"
          echo "Initramfs: $INITRAMFS_FILE"
          echo "install_dir: $install_dir"
          echo "iso_label: $ISO_LABEL"

      - name: Boot ISO in QEMU (kernel direct boot) — complete validation
        run: |
          ISO_FILE="${{ steps.find_iso.outputs.iso_path }}"
          KERNEL_FILE="${{ steps.extract_kernel.outputs.kernel_path }}"
          INITRAMFS_FILE="${{ steps.extract_kernel.outputs.initramfs_path }}"
          INSTALL_DIR="${{ steps.extract_kernel.outputs.install_dir }}"
          ISO_LABEL="${{ steps.extract_kernel.outputs.iso_label }}"
          HAS_KVM="${{ steps.kvm.outputs.has_kvm }}"

          echo "=== QEMU kernel direct boot (420s / 7 min complete validation) ==="
          echo "KVM: $HAS_KVM"
          echo "Kernel: $KERNEL_FILE"
          echo "Initramfs: $INITRAMFS_FILE"
          echo "install_dir: $INSTALL_DIR"
          echo "iso_label: $ISO_LABEL"
          #
          # Boot via QEMU -kernel/-initrd/-append em vez de -cdrom/-boot d.
          # Vantagem: podemos injetar console=ttyS0,115200 via -append sem
          # afetar a ISO de produção (que usa console=tty0 apenas para evitar
          # loop de serial-getty em hardware real).
          #
          # O kernel e initramfs são os mesmos da ISO (extraídos com bsdtar).
          # O -cdrom anexa a ISO para que o archiso hooks encontrem o squashfs.
          #
          # Kernel cmdline:
          #   archisobasedir=arch archisolabel=<label> — archiso params
          #   edd=off                              — pula EDD BIOS probing
          #   console=ttyS0,115200                 — serial para QEMU capturar
          #   console=tty0                         — VGA também (não causa loop
          #                                         porque QEMU tem serial real)
          #   earlyprintk=serial,ttyS0,115200      — mensagens early do kernel
          #   loglevel=8                           — verbosity máxima
          #
          # NOTA: console=ttyS0 aqui NÃO causa o loop serial-getty porque:
          #   1. É injetado apenas no QEMU (via -append), não na ISO de produção
          #   2. QEMU -serial mon:stdio fornece um terminal serial real,
          #      então agetty não falha
          #   3. Na ISO de produção (hardware real), console=ttyS0 não está
          #      presente → sem serial-getty → sem loop
          #
          KVM_ARGS=""
          if [ "$HAS_KVM" = "true" ]; then
            KVM_ARGS="-enable-kvm -cpu host"
          else
            KVM_ARGS="-cpu max"
          fi

          KERNEL_CMDLINE="archisobasedir=$INSTALL_DIR archisolabel=$ISO_LABEL edd=off console=ttyS0,115200 console=tty0 earlyprintk=serial,ttyS0,115200 loglevel=8"
          echo "Kernel cmdline: $KERNEL_CMDLINE"
          echo "QEMU args: $KVM_ARGS -smp 2 -m 4096"

          qemu_log="$(mktemp /tmp/crias-qemu-kernel-XXXXXX.log)"
          timeout 420 qemu-system-x86_64 \
            $KVM_ARGS \
            -smp 2 \
            -m 4096 \
            -kernel "$KERNEL_FILE" \
            -initrd "$INITRAMFS_FILE" \
            -append "$KERNEL_CMDLINE" \
            -cdrom "$ISO_FILE" \
            -nographic \
            -no-reboot \
            -serial mon:stdio \
            </dev/null >"$qemu_log" 2>&1 || true

          echo "=== Log QEMU — primeiras 50 linhas ==="
          head -50 "$qemu_log"
          echo ""
          echo "=== Log QEMU — últimas 100 linhas ==="
          tail -100 "$qemu_log"
          echo ""
          echo "=== Tamanho do log: $(wc -l < "$qemu_log") linhas ==="

          # Validação COMPLETA: kernel deve bootar e archiso deve carregar.
          PASS=false
          BOOT_STAGE=""

          # 1. Kernel bootou completamente?
          if grep -qi 'Linux version' "$qemu_log"; then
            echo "✓ OK: kernel Linux inicializou"
            grep -oE 'Linux version [0-9.]+[^ ]*' "$qemu_log" | head -1
            PASS=true
            BOOT_STAGE="kernel-booted"
          else
            echo "✗ FAIL: kernel Linux não inicializou em 420s" >&2
            BOOT_STAGE="kernel-NOT-booted"
          fi

          # 2. archiso hooks carregaram? (indica que initramfs funcionou)
          if grep -qi 'archiso' "$qemu_log"; then
            echo "✓ OK: archiso hooks carregados"
            BOOT_STAGE="$BOOT_STAGE+archiso"
          else
            echo "⚠ AVISO: archiso não encontrado no log" >&2
          fi

          # 3. Chegou ao userspace? (systemd/init)
          if grep -qi 'Welcome to .*Arch Linux\|systemd\|Starting\|:: running hook' "$qemu_log"; then
            echo "✓ OK: userspace inicializando"
            BOOT_STAGE="$BOOT_STAGE+userspace"
          fi

          echo ""
          echo "Boot stage: $BOOT_STAGE"
          rm -f "$qemu_log"
          if [ "$PASS" != "true" ]; then
            exit 1
          fi

      - name: Validate embedded installer is accessible in live ISO
        run: |
          echo "=== Validação de que instalador embutido está na ISO ==="
          ISO_FILE="${{ steps.find_iso.outputs.iso_path }}"
          # Monta ISO (read-only) e verifica que /opt/crias-server/install.sh existe.
          # Não podemos bootar e interagir facilmente, mas podemos verificar que
          # o airootfs.squfs tem o arquivo examinando o conteúdo da ISO.
          mkdir -p /tmp/iso-mount
          sudo mount -o loop,ro "$ISO_FILE" /tmp/iso-mount || true

          echo "=== Conteúdo raiz da ISO ==="
          ls -la /tmp/iso-mount/ || true

          # Verifica que o diretório arch/ existe (install_dir do profiledef.sh)
          if [ -d /tmp/iso-mount/arch/ ]; then
            echo "✓ OK: diretório arch/ (install_dir) presente na ISO"
            ls /tmp/iso-mount/arch/
          else
            echo "AVISO: diretório arch/ não encontrado na ISO montada" >&2
            ls -la /tmp/iso-mount/ >&2
          fi

          # Verifica presença do vmlinuz e initramfs (boot mínimo)
          if find /tmp/iso-mount/ -name 'vmlinuz-linux' 2>/dev/null | grep -q .; then
            echo "✓ OK: vmlinuz-linux presente na ISO"
          else
            echo "✗ FAIL: vmlinuz-linux não encontrado na ISO" >&2
            sudo umount /tmp/iso-mount 2>/dev/null || true
            exit 1
          fi

          if find /tmp/iso-mount/ -name 'initramfs-linux.img' 2>/dev/null | grep -q .; then
            echo "✓ OK: initramfs-linux.img presente na ISO"
          else
            echo "✗ FAIL: initramfs-linux.img não encontrado na ISO" >&2
            sudo umount /tmp/iso-mount 2>/dev/null || true
            exit 1
          fi

          sudo umount /tmp/iso-mount 2>/dev/null || true
          echo "=== Validação de estrutura da ISO: OK ==="

  build-agent:
    name: Build Agent (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint-go, test-go]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
    defaults:
      run:
        working-directory: discord-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: discord-agent/go.sum

      - name: Install protoc + plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate proto + tidy
        run: |
          make proto
          go mod tidy

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/crias-agent

      - name: Generate checksum
        run: |
          cd build
          sha256sum crias-agent-${{ matrix.goos }}-${{ matrix.goarch }} > crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artifact-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            discord-agent/build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}
            discord-agent/build/crias-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          retention-days: 7

  build-bot:
    name: Build Bot (Docker)
    needs: [lint-python, test-python]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image (smoke test)
        # Build context é a raiz do repo porque Dockerfile copia ../discord-agent/proto/
        run: docker build -t crias-bot:ci -f discord-bot/Dockerfile .

      - name: Save image as tar
        run: docker save crias-bot:ci -o /tmp/crias-bot-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artifact-bot-image
          path: /tmp/crias-bot-image.tar
          retention-days: 3

  # ═══════════════════════════════════════════════════════
  # RELEASE — job único que consolida TODOS artefatos
  # ═══════════════════════════════════════════════════════

  release:
    name: Release (consolidada)
    needs: [build-iso, test-iso-qemu, build-agent, build-bot]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      # attest-build-provenance requires attestations:write + id-token:write.
      # contents:write para criar a release/tag; id-token:write para OIDC token.
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Artefatos baixados ==="
          find artifacts/ -type f | sort
          echo ""
          echo "=== Tamanhos ==="
          du -sh artifacts/*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets/iso release-assets/agent release-assets/bot release-assets/src

          # ISO + checksum
          if [ -f "artifacts/$(ls artifacts/*.iso 2>/dev/null | head -1 | xargs basename)" ]; then
            mv artifacts/*.iso release-assets/iso/ 2>/dev/null || true
            mv artifacts/sha256sums-iso.txt release-assets/iso/ 2>/dev/null || true
          fi

          # Agent binaries + checksums
          mv artifacts/crias-agent-* release-assets/agent/ 2>/dev/null || true

          # Bot Docker image
          mv artifacts/crias-bot-image.tar release-assets/bot/ 2>/dev/null || true

          # Source archives (full + slim)
          # full: repo completo; slim: sem archiso-profile/, docs/, .github/
          mkdir -p release-assets/_pkg/full release-assets/_pkg/slim
          git archive --format=tar HEAD | tar -xf - -C release-assets/_pkg/full
          cp -a release-assets/_pkg/full/. release-assets/_pkg/slim/
          rm -rf release-assets/_pkg/slim/archiso-profile
          rm -rf release-assets/_pkg/slim/docs
          rm -rf release-assets/_pkg/slim/.github/workflows
          (cd release-assets/_pkg/full && zip -qr ../../crias-server-full.zip .)
          (cd release-assets/_pkg/slim && zip -qr ../../crias-server-slim.zip .)

          # Global checksum. Strip one subdir level so sha256sum -c works
          # with flattened GitHub release assets.
          cd release-assets
          find . -type f \( -name '*.iso' -o -name '*.zip' -o -name 'crias-agent-*' -o -name '*.tar' \) \
            -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > sha256sums.txt
          cat sha256sums.txt

      - name: Compute release tag
        id: release_tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
            # Garante unicidade
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Import GPG key (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          # 2A-017: --pinentry-mode loopback evita hang se a chave tem passphrase.
          # 2A-023: set +x como defesa-in-depth (não echoa a chave no log).
          set +x
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback --import

      - name: Sign checksums (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          cd release-assets
          gpg --batch --yes --detach-sign -o sha256sums.txt.sig sha256sums.txt

      - name: Create and push tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CICD-001: tag via env var (nao interpolacao direta) para evitar injecao de script
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          # CICD-001: todos os usos da tag via env var
          assets=()
          # ISO
          for f in release-assets/iso/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Agent binaries
          for f in release-assets/agent/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Bot image
          [ -f release-assets/bot/crias-bot-image.tar ] && assets+=("release-assets/bot/crias-bot-image.tar")
          # Source archives
          assets+=("release-assets/crias-server-full.zip")
          assets+=("release-assets/crias-server-slim.zip")
          # Checksum global (sha256sums.txt com todos os artefatos)
          assets+=("release-assets/sha256sums.txt")
          [ -f release-assets/sha256sums.txt.sig ] && assets+=("release-assets/sha256sums.txt.sig")

          echo "=== Assets para release ==="
          printf '  %s\n' "${assets[@]}"

          # Detecta prerelease via case (sem interpolacao direta)
          PRERELEASE="false"
          case "${RELEASE_TAG}" in
            *-beta*|*-rc*) PRERELEASE="true" ;;
          esac

          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            --title "Release ${RELEASE_TAG}" \
            --generate-notes \
            --prerelease="${PRERELEASE}"

      - name: Attest build provenance
        # 2A-005: gera atestação SLSA build provenance para os artefatos de release.
        # Requer permissions: { attestations: write, id-token: write } (definidas no job).
        # Usuário final verifica com: gh attestation verify <asset> --repo <repo>
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: |
            release-assets/*.iso
            release-assets/*.zip
            release-assets/agent/crias-agent-*
