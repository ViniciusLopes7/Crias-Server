# archiso-profile/airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# Drop-in que sobrescreve o ExecStart padrão do getty@tty1 para auto-logar
# como root no primeiro console da live ISO. É o mesmo mecanismo usado pelo
# perfil releng upstream do archiso (e por EndeavourOS/Garuda/etc.).
#
# Root permanece travado no /etc/shadow (hash '!' ou '*' — verificado por
# tests/iso-live-credentials-validate.sh). O autologin bypassa o prompt de
# senha apenas no tty1 físico, sem expor root via SSH ou outros ttys.
#
# Comportamento resultante:
#   - tty1: root cai direto no shell (sem digitar login/senha)
#   - tty2-tty6: prompt normal; root não consegue logar (senha travada)
#   - SSH: sshd não sobe no boot (ver docs/security.md)
#
# Para entrar só no shell do live ISO sem rodar nada, basta não executar
# nenhum comando — o bootstrap (crias-bootstrap) é opt-in, disparado pelo
# usuário quando decide, e não mais auto-startado no login.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear %I $TERM
