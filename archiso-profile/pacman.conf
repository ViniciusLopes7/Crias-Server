#
# pacman.conf – used exclusively by mkarchiso during ISO build
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
# Retry automático: se um mirror falhar (rate-limit, timeout), curl tenta
# novamente 5x com backoff. Resolve erros transientes do fastly.mirror.pkgbuild.com.
XferCommand = /usr/bin/curl --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 -fL -o %o %u

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist
