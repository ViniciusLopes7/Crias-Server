# GRUB configuration for Crias-Server ISO
#
# IMPORTANTE: NÃO adicionar `console=ttyS0,115200` ao linux line.
# Quando console=ttyS0 está na linha de comando do kernel, o
# systemd-getty-generator inicia automaticamente serial-getty@ttyS0.service.
# Em hardware real sem terminal serial conectado, esse serviço entra em loop
# infinito — travando o boot.
#
# Para capturar output do kernel no QEMU (-nographic), o teste CI usa
# QEMU -kernel/-initrd/-append para injetar console=ttyS0,115200 apenas no
# ambiente de teste, sem afetar a ISO de produção.
#
# Referência: https://wiki.archlinux.org/title/Working_with_the_serial_console

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf
insmod png

set default="0"
# TIMEOUT em segundos. 1 = 1 segundo (boot rápido para CI).
set timeout=1

if [ -f /boot/grub/fonts/unicode.pf2 ]; then
    loadfont /boot/grub/fonts/unicode.pf2
    terminal_output gfxterm
elif [ -f /grub/fonts/unicode.pf2 ]; then
    loadfont /grub/fonts/unicode.pf2
    terminal_output gfxterm
fi

if [ -f /boot/grub/boot-bg.png ]; then
    background_image /boot/grub/boot-bg.png
elif [ -f /grub/boot-bg.png ]; then
    background_image /grub/boot-bg.png
fi

set color_normal=white/black
set color_highlight=cyan/black

menuentry "Crias Server OS (Arch Linux)" --class arch --class linux {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% edd=off console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Crias Server OS (Copy to RAM)" --class arch --class linux {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% copytoram=y edd=off console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
