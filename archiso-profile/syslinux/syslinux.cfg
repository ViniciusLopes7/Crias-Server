# syslinux.cfg for Crias-Server ISO (BIOS boot)
#
# IMPORTANTE: NÃO adicionar `console=ttyS0,115200` ao APPEND.
# Quando console=ttyS0 está na linha de comando do kernel, o
# systemd-getty-generator inicia automaticamente serial-getty@ttyS0.service.
# Em hardware real sem terminal serial conectado (a maioria dos desktops,
# laptops e VPS), esse serviço entra em loop infinito (agetty inicia, não
# detecta carrier, exita, systemd reinicia) — travando o boot.
#
# Para capturar output do kernel no QEMU (-nographic), o teste CI usa
# QEMU -kernel/-initrd/-append para injetar console=ttyS0,115200 apenas no
# ambiente de teste, sem afetar a ISO de produção.
#
# Referência: https://wiki.archlinux.org/title/Working_with_the_serial_console
# "At boot, systemd-getty-generator(8) will start a getty instance for each
#  console specified in the kernel command line."

UI menu.c32
MENU TITLE Crias Server OS
MENU BACKGROUND boot-bg.png

DEFAULT arch
PROMPT 0
# TIMEOUT em décimos de segundo. 10 = 1 segundo (boot rápido para CI).
# Em hardware real com monitor, usuário tem 1s para escolher opção no menu.
TIMEOUT 10

LABEL arch
    MENU LABEL Crias Server OS (Arch Linux)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% edd=off console=tty0

LABEL arch_copytoram
    MENU LABEL Crias Server OS (Copy to RAM)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% copytoram=y edd=off console=tty0
